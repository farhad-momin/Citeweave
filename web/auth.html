<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Signing in</title>
  <style>
    :root { color-scheme: light dark; --paper: #F3F5F2; --ink: #1D2A2A; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --paper: #141A1C; --ink: #E3EAE7; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--paper); color: var(--ink);
      font: 15px "Segoe UI", system-ui, sans-serif; padding: 16px; }
  </style>
</head>
<body>
  <p id="msg">Finishing sign-in. This window closes by itself.</p>
  <script>
    // Hands the sign-in result back to Citeweave in the window that opened this one.
    (function () {
      var search = location.search || ("?" + location.hash.replace(/^#/, ""));
      var sameOrigin = false;
      // reading a cross-origin opener's location throws, so check it safely
      try { sameOrigin = !!window.opener && window.opener.location.origin === location.origin; } catch (e) { sameOrigin = false; }
      if (sameOrigin) {
        window.opener.postMessage({ type: "citeweave-auth", search: search }, location.origin);
        window.close();
      } else {
        document.getElementById("msg").textContent = "Sign-in finished. You can close this window and return to Citeweave.";
      }
    })();
  </script>
</body>
</html>
