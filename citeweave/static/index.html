<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Citeweave</title>
  <link rel="icon" href="/static/icon.png">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <div class="shell">
    <nav class="rail" aria-label="Main">
      <a class="brand" href="#/search" aria-label="Citeweave home">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
          <path d="M4 10 C 12 4, 20 16, 28 10" />
          <path d="M4 16 C 12 22, 20 10, 28 16" />
          <path d="M4 22 C 12 16, 20 28, 28 22" />
          <circle cx="16" cy="13" r="2.4" /><circle cx="16" cy="19" r="2.4" />
        </svg>
        <span>Citeweave</span>
      </a>
      <div class="nav">
        <a href="#/search" data-view="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>Search</a>
        <a href="#/ask" data-view="ask"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/><path d="M9 9.5h6M9 12.5h4"/></svg>Ask a question</a>
        <a href="#/map" data-view="map"><svg viewBox="0 0 24 24"><circle cx="6" cy="7" r="2.2"/><circle cx="18" cy="6" r="2.2"/><circle cx="12" cy="17" r="2.6"/><path d="M7.8 8.2l3 6.6M16.6 7.6l-3.4 7.2M8.2 6.8h7.6"/></svg>Citation map</a>
        <a href="#/library" data-view="library"><svg viewBox="0 0 24 24"><path d="M5 4h4v16H5zM10 4h4v16h-4z"/><path d="M15.5 5.2l3.8-1 3.2 15.4-3.8 1z"/></svg>Library</a>
        <a href="#/tables" data-view="tables"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="14" rx="1.5"/><path d="M3.5 10h17M3.5 14.5h17M9.5 5v14"/></svg>Tables</a>
        <a href="#/profile" data-view="profile"><svg viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="3.5"/><path d="M5 20c1.2-4 4-5.5 7-5.5s5.8 1.5 7 5.5"/></svg>Researcher</a>
      </div>
      <div class="rail-foot">
        <a href="#/settings" data-view="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v2.5M12 18.5V21M3 12h2.5M18.5 12H21M5.6 5.6l1.8 1.8M16.6 16.6l1.8 1.8M5.6 18.4l1.8-1.8M16.6 7.4l1.8-1.8"/></svg>Settings</a>
        <div class="ai-pill" id="ai-pill" title="AI provider"></div>
      </div>
    </nav>
    <main id="view" tabindex="-1"></main>
    <aside id="drawer" class="drawer" aria-label="Paper details" hidden></aside>
  </div>
  <div id="toasts" aria-live="polite"></div>
  <div id="modal-root"></div>
  <script type="module" src="/static/js/app.js"></script>
</body>
</html>
